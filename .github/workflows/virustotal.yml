name: Virus scan

# For each release: scans every file on VirusTotal, checks the Android app for trackers
# against Exodus Privacy's signatures, and adds both results to the release notes, where the
# website's Security page reads them. Runs when a release is published; run it again by hand
# (Actions > Virus scan > Run workflow) after attaching more files.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan, for example v2.6
        required: true

permissions:
  contents: write

concurrency:
  group: virustotal-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      # The release's own code, to build the unshrunk app the tracker check reads.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Check the API key is set
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "::error::Add a VT_API_KEY secret (a free VirusTotal API key)"; exit 1; fi
      - name: Download the release files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
      - name: Check the Android app for trackers
        run: |
          apk=$(ls files/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then echo "No APK in this release"; : > trackers.md; exit 0; fi
          (cd release-src/mobile && ./gradlew assembleDebug --no-daemon -q)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          python .github/scripts/trackers.py release-src/mobile/app/build/outputs/apk/debug/app-debug.apk "$apk" "$tools/dexdump" "$tools/aapt2" > trackers.md
          cat trackers.md
      - name: Scan on VirusTotal
        run: |
          pip install --quiet requests
          python .github/scripts/virustotal.py files > scan.md
          cat scan.md
      - name: Add the results to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python - <<'EOF'
          import re
          body = open("body.md", encoding="utf-8").read()
          sections = [open(f, encoding="utf-8").read().strip() for f in ("trackers.md", "scan.md")]
          # Replace earlier results, if any; otherwise add them at the end.
          for tag in ("trackers", "virustotal"):
              body = re.sub(r"\n*<!-- %s -->.*?<!-- /%s -->" % (tag, tag), "", body, flags=re.S)
          body = body.rstrip() + "".join("\n\n" + s for s in sections if s)
          open("body.md", "w", encoding="utf-8").write(body + "\n")
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
