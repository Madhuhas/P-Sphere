# Runs the shared core's tests on Windows (the primary platform) and Linux, and builds the Android
# app, on every push to the default branch and every pull request. Offline: the tests use fake devices.
name: Tests

on:
  push:
    branches: [p2p-v3, main]
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    name: Shared core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew test

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew assembleDebug

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew build
