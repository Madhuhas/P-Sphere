org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m
# Use in-process strategy if daemon connection fails
# kotlin.compiler.execution.strategy=in-process
# AGP 9 made R8's keep rules "strict": `-keep class X` no longer keeps X's empty constructor.
# Libraries that create classes by reflection (WorkManager's Room database, workers) then crash
# the release app on launch. Keep the AGP 8 behaviour that 2.2 shipped with.
android.r8.strictFullModeForKeepRules=false
