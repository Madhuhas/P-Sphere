<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P-Sphere</title>
    <style>
      :root[data-theme="dark"] {
        --bg:        #0f1923;
        --surface:   #1e2a3a;
        --surface2:  #162447;
        --border:    #2a2a3a;
        --text:      #eeeeee;
        --text-muted:#888888;
        --primary:   #1565c0;
        --accent:    #90caf9;
        --danger:    #c62828;
        --input-bg:  #111111;
        --nav-bg:    #1a1a2e;
        --overlay:   rgba(0,0,0,.85);
      }
      :root[data-theme="light"] {
        --bg:        #f0f4f8;
        --surface:   #ffffff;
        --surface2:  #e8f0fe;
        --border:    #d0d7e3;
        --text:      #1a1a2e;
        --text-muted:#555555;
        --primary:   #1565c0;
        --accent:    #1565c0;
        --danger:    #c62828;
        --input-bg:  #f5f7fa;
        --nav-bg:    #1a1a2e;
        --overlay:   rgba(0,0,0,.6);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: background .25s, color .25s; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .page-enter { animation: fadeSlideIn .22s ease both; }

      @keyframes skeletonPulse {
        0%, 100% { opacity: .4; }
        50%       { opacity: .8; }
      }
      .skeleton { background: var(--border); border-radius: 6px; animation: skeletonPulse 1.4s ease infinite; }

      @media (max-width: 640px) {
        .nav-sidebar { width: 56px !important; }
        .nav-label   { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
